<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사고사례 판단 훈련</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6eb; --ink:#1d2330; --sub:#667085; --accent:#1f5fbf; --ok:#1a7f4b; --bad:#c0392b; --warn:#b26b00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#12305e; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  header span { font-size:13px; opacity:.75; }
  .wrap { display:grid; grid-template-columns: 300px 1fr; gap:20px; padding:20px 24px; max-width:1400px; margin:0 auto; }
  aside .card, main .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .btn { border:1px solid var(--line); background:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .list-item { padding:10px; border-radius:8px; cursor:pointer; border:1px solid transparent; margin-bottom:6px; }
  .list-item:hover { background:#f0f4fb; }
  .list-item.active { border-color:var(--accent); background:#eef3fc; }
  .list-item .t { font-size:14px; font-weight:600; line-height:1.4; }
  .list-item .m { font-size:12px; color:var(--sub); margin-top:2px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#eef1f5; color:#344054; margin-right:6px; }
  .tag.warn { background:#fff4e0; color:var(--warn); }
  .tag.ok { background:#e6f5ec; color:var(--ok); }
  .tag.bad { background:#fdecea; color:var(--bad); }
  h2 { font-size:20px; margin:0 0 6px; }
  h3 { font-size:15px; margin:18px 0 8px; color:#12305e; }
  .meta { color:var(--sub); font-size:13px; }
  ul.items { margin:0; padding-left:18px; }
  ul.items li { margin:6px 0; line-height:1.55; font-size:14px; }
  a.pg { font-size:11px; color:var(--accent); text-decoration:none; border:1px solid #c9d7f0; border-radius:4px; padding:0 4px; margin-left:4px; white-space:nowrap; }
  .q { font-size:12px; color:var(--sub); display:block; margin-top:2px; }
  .tabs { display:flex; gap:6px; margin:14px 0 4px; }
  .tabs .btn.on { background:#12305e; color:#fff; border-color:#12305e; }
  .banner { background:#fff4e0; border:1px solid #f3d19c; color:#6b4300; padding:10px 12px; border-radius:8px; font-size:13px; margin:10px 0; }
  .situation { background:#f3f6fb; border-left:4px solid var(--accent); padding:12px 14px; border-radius:6px; line-height:1.6; font-size:15px; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; font-size:14px; line-height:1.5; }
  .opt:disabled { opacity:1; cursor:default; color:var(--ink); }
  .opt.correct { border-color:var(--ok); background:#e6f5ec; }
  .opt.wrong { border-color:var(--bad); background:#fdecea; }
  .feedback { margin-top:12px; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:#fafbfc; font-size:14px; line-height:1.6; }
  .feedback b { display:block; margin-bottom:4px; }
  .progress { font-size:13px; color:var(--sub); margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; }
  .empty { color:var(--sub); font-size:14px; padding:30px; text-align:center; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>사고사례 판단 훈련</h1><span>사조위 철도 사고조사보고서 → 구조화 → 단계별 판단 훈련</span></header>
<div class="wrap">
  <aside>
    <div class="card">
      <div class="row">
        <input type="file" id="file" accept="application/pdf" multiple style="display:none">
        <button class="btn primary" onclick="document.getElementById('file').click()">보고서 PDF 올리기</button>
        <button class="btn" onclick="showStats()">반복 패턴</button>
      </div>
      <div id="uploadMsg" class="meta" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:14px;margin-bottom:6px">유사사고 검색</div>
      <textarea id="q" rows="3" style="width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px" placeholder="예: 야간 선로 작업 중 인접선 열차 진입"></textarea>
      <button class="btn primary" style="margin-top:6px;width:100%" onclick="doSearch()">비슷한 과거 사고 찾기</button>
    </div>
    <div class="card"><div id="list"><div class="empty">아직 보고서가 없습니다</div></div></div>
  </aside>
  <main id="main"><div class="card empty">왼쪽에서 보고서를 올리거나 선택하세요</div></main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATE = { ocr_needed:"OCR 필요", indexing:"색인 중", parsing:"파싱 중", extracting:"구조화 중", scenario:"시나리오 생성 중", queued:"대기", done:"완료", error:"오류" };
let current = null, pollTimer = null;

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

$("#file").addEventListener("change", async e => {
  for (const f of e.target.files) {
    $("#uploadMsg").textContent = `${f.name} 올리는 중…`;
    const fd = new FormData(); fd.append("file", f);
    try { const { id } = await api("/api/reports", { method:"POST", body:fd }); current = id; }
    catch (err) { $("#uploadMsg").textContent = "실패: " + err.message; return; }
  }
  $("#uploadMsg").textContent = "처리를 시작했습니다. 보고서 1건에 1~2분 걸립니다.";
  e.target.value = "";
  await loadList(); if (current) openReport(current);
});

async function loadList() {
  const items = await api("/api/reports");
  if (!items.length) return;
  $("#list").innerHTML = items.map(it => {
    const st = it.status.state;
    const cls = st === "done" ? "ok" : (st === "error" || st === "ocr_needed") ? "bad" : "warn";
    return `<div class="list-item ${it.id===current?"active":""}" onclick="openReport('${it.id}')">
      <div class="t">${esc(it.title)}</div>
      <div class="m">${esc(it.report_no)} ${esc(it.occurred_at)}</div>
      <div class="m">접수 ${esc((it.ingested_at||"").replace("T"," ").slice(0,16))}</div>
      <div style="margin-top:4px">${it.accident_type?`<span class="tag">${esc(it.accident_type)}</span>`:""}<span class="tag ${cls}">${STATE[st]||st}</span></div>
    </div>`;
  }).join("");
  const busy = items.some(it => !["done","error","ocr_needed"].includes(it.status.state));
  clearTimeout(pollTimer);
  if (busy) pollTimer = setTimeout(async () => { await loadList(); if (current) refreshIfBusy(); }, 3000);
}

async function refreshIfBusy() {
  const { status } = await api(`/api/reports/${current}`);
  if ($("#main").dataset.state !== status.state) openReport(current, $("#main").dataset.tab);
}

const pg = (ev) => ev && ev.page ? `<a class="pg" target="_blank" href="/api/reports/${current}/pdf#page=${ev.page}" title="${esc(ev.quote)}">p.${ev.page}</a>` : "";
const items = (arr, fmt) => arr && arr.length ? `<ul class="items">${arr.map(fmt).join("")}</ul>` : `<div class="meta">보고서에서 찾지 못함</div>`;
const withEv = x => `<li>${esc(x.text)}${pg(x.evidence)}${x.evidence?.quote?`<span class="q">“${esc(x.evidence.quote)}”</span>`:""}</li>`;

async function openReport(id, tab = "record") {
  current = id; loadList();
  const { status, record } = await api(`/api/reports/${id}`);
  const m = $("#main"); m.dataset.state = status.state; m.dataset.tab = tab;
  if (status.state !== "done" && !record) {
    m.innerHTML = `<div class="card"><h2>${esc(status.filename||id)}</h2>
      <p><span class="tag ${["error","ocr_needed"].includes(status.state)?"bad":"warn"}">${STATE[status.state]||status.state}</span> ${esc(status.message)}</p>
      ${status.state==="error"?`<p class="meta">.env의 API 키와 LLM 설정을 확인하세요.</p>`:""}
      ${status.state==="ocr_needed"?`<p class="meta">글자가 이미지나 도형으로 들어간 PDF라 텍스트를 읽을 수 없습니다. LLM 호출 없이 건너뛰었습니다.</p>`:""}</div>`;
    return;
  }
  const r = record;
  m.innerHTML = `<div class="card">
    <h2>${esc(r.title)}</h2>
    <div class="meta">${[r.report_no, r.occurred_at, r.location].filter(Boolean).map(esc).join(" · ")}</div>
    <div style="margin-top:6px"><span class="tag">${esc(r.accident_type)}</span>${(r.vehicles||[]).map(v=>`<span class="tag">${esc(v)}</span>`).join("")}
      <a class="pg" target="_blank" href="/api/reports/${id}/pdf">원문 PDF</a></div>
    <div class="tabs">
      <button class="btn ${tab==="record"?"on":""}" onclick="openReport('${id}','record')">사고 정보</button>
      <button class="btn ${tab==="train"?"on":""}" onclick="openReport('${id}','train')">판단 훈련</button>
    </div></div>
    <div id="body"></div>`;
  if (tab === "record") { renderRecord(r); renderRelated(id); } else renderTraining(status);
}

async function renderRelated(id) {
  const box = $("#related"); if (!box) return;
  let groups = [];
  try { groups = await api(`/api/reports/${id}/related`); } catch { box.innerHTML = ""; return; }
  if (!groups.length) { box.innerHTML = `<div class="card"><h3 style="margin-top:0">비슷한 과거 사고</h3><div class="meta">비교할 다른 보고서가 아직 없습니다</div></div>`; return; }
  box.innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">비슷한 과거 사고</h3>
      <button class="btn" id="cmpBtn" onclick="doCompare('${id}')">공통점 요약 (LLM)</button></div>
    <div id="cmp"></div>
    ${groups.map(g => `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
      <div class="row" style="justify-content:space-between">
        <a href="#" onclick="openReport('${g.report_id}');return false" style="font-weight:700;color:var(--ink)">${esc(g.title)}</a>
        <span class="tag">유사도 ${g.score.toFixed(2)}</span></div>
      <div class="meta">${[g.accident_type, g.occurred_at].filter(Boolean).map(esc).join(" · ")}</div>
      ${g.shared_rules.length?`<div style="margin-top:6px"><span class="tag bad">이번에도 반복된 규정</span>${g.shared_rules.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
      <ul class="items">${g.hits.map(h => `<li><span class="tag">${esc(h.kind)}</span>${esc(h.text.length>160?h.text.slice(0,160)+"…":h.text)}${pgOf(g.report_id,h.page)}</li>`).join("")}</ul>
    </div>`).join("")}</div>`;
}

async function doCompare(id) {
  $("#cmpBtn").disabled = true; $("#cmp").innerHTML = `<div class="meta" style="margin-top:8px">요약 중…</div>`;
  try {
    const r = await api(`/api/reports/${id}/compare`, { method:"POST" });
    $("#cmp").innerHTML = `<div class="banner">검색된 과거 사고 조각만 근거로 LLM이 쓴 요약입니다. 원문과 대조하세요.</div><div class="situation" style="white-space:pre-wrap">${esc(r.answer)}</div>`;
  } catch (e) { $("#cmp").innerHTML = `<div class="banner">실패: ${esc(e.message)}</div>`; }
  $("#cmpBtn").disabled = false;
}

function renderRecord(r) {
  $("#body").innerHTML = `<div id="related"></div><div class="card">
    <div class="banner">모든 항목은 LLM이 추출한 결과입니다. <b>p.N</b>을 눌러 원문과 대조하세요.</div>
    <h3>개요</h3><p style="line-height:1.6;font-size:14px">${esc(r.summary)}</p>
    ${r.damage?`<p class="meta">피해: ${esc(r.damage)}</p>`:""}
    <h3>사고 경위</h3>${items(r.timeline, t => `<li>${t.time?`<b>${esc(t.time)}</b> `:""}${esc(t.event)}${pg(t.evidence)}</li>`)}
    <h3>직접 원인</h3>${items(r.direct_causes, withEv)}
    <h3>기여요인</h3>${items(r.contributing_factors, withEv)}
    <h3>지적된 규정·지침</h3>${items(r.violated_rules, v => `<li><b>${esc(v.rule_name)}</b> ${esc(v.article)} — ${esc(v.description)}${pg(v.evidence)}</li>`)}
    <h3>안전권고</h3>${items(r.recommendations, v => `<li><span class="tag">${esc(v.target)}</span>${esc(v.text)}${pg(v.evidence)}</li>`)}
    <h3>교육·훈련 관련 지적</h3>${items(r.training_findings, withEv)}
  </div>`;
}

let sc = null, step = 0, score = 0, answered = false;

async function renderTraining(status) {
  try { sc = await api(`/api/reports/${current}/scenario`); }
  catch { $("#body").innerHTML = `<div class="card"><span class="tag warn">${STATE[status.state]||status.state}</span> ${esc(status.message)}</div>`; return; }
  step = -1; score = 0; drawStep();
}

function drawStep() {
  const head = `<div class="row" style="justify-content:space-between">
      <div><span class="tag ${sc.review_status==="검수 완료"?"ok":"warn"}">${esc(sc.review_status)}</span><span class="tag">역할: ${esc(sc.role)}</span></div>
      <div class="row">
        <button class="btn" onclick="regen()">시나리오 다시 생성</button>
        ${sc.review_status!=="검수 완료"?`<button class="btn" onclick="review()">검수 완료 표시</button>`:""}
      </div></div>
    ${sc.review_status!=="검수 완료"?`<div class="banner">교관 검수 전 초안입니다. 정답·근거가 보고서와 맞는지 확인한 뒤 교육에 쓰세요.</div>`:""}`;
  if (step === -1) {
    $("#body").innerHTML = `<div class="card">${head}<h2 style="margin-top:12px">${esc(sc.title)}</h2>
      <div class="situation">${esc(sc.intro)}</div>
      <p class="meta">판단 지점 ${sc.steps.length}개</p>
      <button class="btn primary" onclick="step=0;drawStep()">훈련 시작</button></div>`;
    return;
  }
  if (step >= sc.steps.length) {
    $("#body").innerHTML = `<div class="card">${head}<h2 style="margin-top:12px">결과: ${score} / ${sc.steps.length}</h2>
      <h3>마무리</h3><div class="situation">${esc(sc.debrief)}</div>
      <div class="row" style="margin-top:14px"><button class="btn" onclick="step=-1;score=0;drawStep()">처음부터</button>
      <button class="btn" onclick="openReport(current,'record')">사고 정보 보기</button></div></div>`;
    return;
  }
  const s = sc.steps[step]; answered = false;
  $("#body").innerHTML = `<div class="card">${head}
    <div class="progress" style="margin-top:12px">판단 지점 ${step+1} / ${sc.steps.length}</div>
    <div class="situation">${esc(s.situation)}</div>
    <h3>${esc(s.question)}</h3>
    ${s.options.map(o => `<button class="btn opt" data-id="${esc(o.id)}" onclick="answer('${esc(o.id)}')">${esc(o.id)}. ${esc(o.text)}</button>`).join("")}
    <div id="fb"></div></div>`;
}

function answer(id) {
  if (answered) return; answered = true;
  const s = sc.steps[step], ok = id === s.answer_id; if (ok) score++;
  document.querySelectorAll(".opt").forEach(b => {
    if (b.dataset.id === s.answer_id) b.classList.add("correct");
    else if (b.dataset.id === id) b.classList.add("wrong");
    b.disabled = true;
  });
  $("#fb").innerHTML = `<div class="feedback">
    <b style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"올바른 판단입니다":"다시 생각해볼 판단입니다"}</b>${esc(s.explanation)}
    ${s.rule_refs?.length?`<div style="margin-top:8px">${s.rule_refs.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`:""}
    <b style="margin-top:10px">실제 사고에서는</b>${esc(s.what_happened)}${pg(s.evidence)}
    </div><div style="margin-top:12px"><button class="btn primary" onclick="step++;drawStep()">${step+1<sc.steps.length?"다음 판단 지점":"결과 보기"}</button></div>`;
}

async function regen() {
  if (!confirm("시나리오를 다시 생성할까요? 지금 시나리오는 덮어씁니다.")) return;
  await api(`/api/reports/${current}/scenario/regenerate`, { method:"POST" });
  await loadList(); openReport(current, "train");
}
async function review() {
  await api(`/api/reports/${current}/scenario/review`, { method:"POST" });
  sc.review_status = "검수 완료"; drawStep();
}

async function showStats() {
  const s = await api("/api/stats");
  $("#main").innerHTML = `<div class="card"><h2>반복 패턴 (보고서 ${s.reports}건)</h2>
    <p class="meta">보고서를 여러 건 올리면 반복되는 규정 위반·교육 지적이 보입니다.</p>
    <h3>사고 유형</h3><table>${s.accident_types.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}건</td></tr>`).join("")||"<tr><td class='meta'>없음</td></tr>"}</table>
    <h3>지적된 규정·지침</h3><table>${s.violated_rules.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}건</td></tr>`).join("")||"<tr><td class='meta'>없음</td></tr>"}</table>
    <h3>교육·훈련 관련 지적</h3>${items(s.training_findings, t=>`<li>${esc(t.text)} <span class="meta">— ${esc(t.report)}</span></li>`)}
  </div>`;
}

const pgOf = (rid, page) => page ? `<a class="pg" target="_blank" href="/api/reports/${rid}/pdf#page=${page}">p.${page}</a>` : "";
let lastGroups = [];

function drawGroups(groups) {
  return groups.map(g => `<div class="card">
    <div class="row" style="justify-content:space-between">
      <a href="#" onclick="openReport('${g.report_id}');return false" style="font-weight:700;color:var(--ink)">${esc(g.title)}</a>
      <span class="tag">유사도 ${g.score.toFixed(2)}</span></div>
    <ul class="items">${g.hits.map(h => `<li><span class="tag">${esc(h.kind)}</span>${esc(h.text.length>220?h.text.slice(0,220)+"…":h.text)}${pgOf(g.report_id,h.page)}</li>`).join("")}</ul>
  </div>`).join("");
}

async function doSearch() {
  const q = $("#q").value.trim(); if (!q) return;
  current = null; loadList();
  $("#main").innerHTML = `<div class="card empty">검색 중…</div>`;
  lastGroups = await api("/api/search", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q}) });
  $("#main").innerHTML = `<div class="card"><h2>비슷한 과거 사고</h2><div class="meta">“${esc(q)}”</div>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="askBtn" onclick="doAsk()">검색 결과로 요약하기 (LLM)</button></div>
      <div id="answer"></div></div>
    ${lastGroups.length ? drawGroups(lastGroups) : `<div class="card empty">색인된 보고서가 없습니다</div>`}`;
}

async function doAsk() {
  const q = $("#q").value.trim(); $("#askBtn").disabled = true;
  $("#answer").innerHTML = `<div class="meta" style="margin-top:10px">요약 중…</div>`;
  try {
    const r = await api("/api/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q}) });
    $("#answer").innerHTML = `<div class="banner">아래 요약은 검색된 조각만 근거로 LLM이 쓴 것입니다. 원문과 대조하세요.</div>
      <div class="situation" style="white-space:pre-wrap">${esc(r.answer)}</div>`;
  } catch (e) { $("#answer").innerHTML = `<div class="banner">실패: ${esc(e.message)}</div>`; }
  $("#askBtn").disabled = false;
}

loadList();
</script>
</body>
</html>
