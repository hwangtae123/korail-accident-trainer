# 양식 프로필 (예시 문서 allinone_cancer_2_0의 회사 양식, 사람이 맞춘 값). 같은 양식 문서끼리 같이 쓴다.
# 문서 설정 (config/docs/<doc_id>.yaml)의 profile: 이름으로 고른다. 새 양식은 parsing/profile_draft.py가 초안을 만든다.
# 폰트 키 형식은 "<기본 폰트 이름>/<크기 (pt, 소수 한 자리, 끝 0 생략)>" (subset 접두어 "ABCDEF+"는 뗀다).
# 이 문서에 없는 역할은 UNSET/0 (어느 줄과도 맞지 않음).
# 문서를 덤프할 때 여기 폰트가 실제로 쓰였는지, 가장 많이 쓰인 폰트가 body와 같은지 확인해 다르면 경고한다
# (parsing/config.py check_profile).

# 자동 구역 규칙 (parsing/auto_zones.py): insurance = 주계약·특약·장해분류표 이름으로 나눔, generic = 앞단·간지 빼고 본문
auto_zones: insurance

fonts:
  body: SLIL/10            # 본문. rel_x 기준선 (그 쪽 표 밖 body 줄의 최소 x0)
  article_title: SLIB/10   # 조 제목 (제N조, 제N-M조 줄이 이 폰트면 제목, 본문 폰트면 문장 속 참조)
  gwan_title: SLIM/12      # 관 제목
  pyeon_title: SLIM/14     # 편 제목
  section_title: SLIB/12   # 별표 제목 (패턴 없음, 왼쪽 작은 상자에 라벨 "별표N"). 약관·특약 끝에 나옴
  title_band: [SLIM/16, SLIB/16]  # 제목 띠 (배경색 상자 안 특약명·약관명). 이 폰트 줄이 든 영역은 표가 아니라 제목 띠
                                  # 특약명 띠는 SLIM/16, 주계약 약관명 띠는 SLIB/16
  small: SLIL/8            # 작은 글씨 (장해분류표 본문 등)
  form_code: SLIL/7        # 양식 코드 줄 폰트

# 굵은 글씨 판별: 기본 폰트 이름이 이 접두어로 시작하거나 이름에 "Bold"가 있으면 굵게
bold_font_prefixes: [SLIB]

# 박스 라벨 열 글자 (공백·괄호를 뺀 뒤 비교). 앞의 셋이 나오면 그 영역은 표가 아니라 박스.
box_labels:
  box_desc: 설명
  box_caution: 유의사항
  box_terms: 용어해설
  box_example: 예시
box_kinds_not_table: [box_desc, box_caution, box_terms]

# 라벨 열 채움 색으로 박스 종류 정하기 (라벨 글자가 없을 때, 예: 쪽을 넘어간 박스의 다음 쪽 부분).
# 이 회사 문서: 회색 라벨 열 = 용어 해설 (라벨 글자가 있는 회색 박스 59개가 모두 용어 해설, 다른 라벨 0).
box_label_fills:
  - {fill: [0.85], kind: box_terms}
box_label_fill_tol: 0.02

# 예시 시작 줄: 이 꺾쇠로 시작하고 끝나며 keyword를 포함하는 굵은 줄. 그 줄부터 같은 박스 끝까지 example_box로 제외.
example:
  open: "<〈"
  close: ">〉"
  keyword: 예시
  keep_in_box_kinds: [box_desc]  # 이 종류 박스 안 예시는 제외하지 않음 (설명 박스 예시 = 주요 계산식). 그 밖 상자의 예시는 제외 + 그림 자리

# 용어 해설 쌍: 내용 열에서 example.open 꺾쇠로 감싼 용어로 시작하는 줄 + 정의

# 양식 코드 줄 (쪽 위 header로 제외): fonts.form_code 폰트이고 전체가 이 정규식에 맞는 줄
form_code_regex: '[A-Z]{2}\d{7}\(\d{6}\)'

references:                   # 조·항 참조 (parsing/tree.py extract_refs)
  # 조 참조 바로 앞에 이 낱말이 오면 다른 약관을 가리키는 참조 (대상 노드를 찾지 않고 종류만 표시)
  other_contract_words: [주계약, 보통약관, 기본계약]
  # 「…」 안 이름이 이것으로 끝나면 약관 이름 (현재 약관 이름에 들어 있으면 같은 약관, 아니면 다른 약관)
  contract_name_suffixes: [약관, 특약, 계약]
  # 법령 이름 끝 (「…법」 제N조, 같은 법 시행령 제N조 등). 부록 (법령)은 파싱하지 않으므로 대상 없이 기록만
  law_suffixes: [법, 법률, 시행령, 시행규칙, 령, 규칙, 규정, 고시]
