# 표 파싱 설정 (Phase 1). 이 파일에 자격증명과 경로는 넣지 않는다.
#
# 아래 수치(pt 단위)는 모두 "초기 제안값, 더미 검증 후 조정"이다. 확정값이 아니다.
# 실제 문서에 맞는 값은 analyze 리포트의 수치를 보고 사용자가 조정한다.
table:
  # 가까운 좌표를 하나로 묶는 허용 오차(pt). 더미 jitter 테스트로 조정 예정.
  snap_tol: 1.5
  # 격자 변 하나가 "선 있음"으로 인정되려면 선분이 덮어야 하는 비율(0 초과 1 이하).
  line_min_coverage: 0.9 # 병합 인식
  # 이 폭(pt) 이하의 rect는 선분 1개로 취급한다 (얇은 rect로 그린 표선).
  thin_rect_max_width: 2.0 #HWP에서 변환한 PDF는 표 선을 선분이 아니라 아주 얇은 채운 사각형으로 그리는 경우
  # 이 길이(pt) 미만의 선분은 무시한다 (점, 장식, 눈금 등).
  min_line_length: 3.0 # 점, 장식 기호, 글자 모양의 일부 같은 잡음을 걸러내는 용도
  # 다단 header를 열 이름으로 이을 때의 구분자 (3.1절 `G-a` 표기 기준).
  header_join: "-" # 병합을 위함 G G-a G-b
  # 셀 안 여러 줄을 하나의 텍스트로 이을 때의 구분자. 잠정값, Step C(P4 결과)에서 결정.
  cell_line_join: " " #셀 안 글자가 두 줄로 줄바꿈된 경우, 두 줄을 이을 때 넣는 문자
  # 표 아래 주석 줄의 시작 표식 목록 (문서별 설정, 4절 1번). 목록 중 하나로 시작하면 주석이다.
  # 줄 시작 비교는 양쪽을 NFKC 정규화한 뒤 하므로 "㈜"는 "(주)"로 인식된다 (저장하는 주석 텍스트는 원문 그대로).
  note_prefixes: ["(주)", "※"]
  # 주석 줄이 이어지는 것으로 보는 최대 수직 간격(pt). 간격 = (표 bottom 또는 앞 줄 bottom) -> 다음 줄 top.
  # 잠정값이며 실제 문서에서 notes가 0개로 나오면 이 값을 키워 본다.
  note_max_gap: 10.0 # 주석 줄 연결 최대 간격
  # 점선(가늘고 긴 대시 조각의 나열)을 이어 붙일 때 인접 조각 사이 최대 틈(pt, 0 이상).
  # 초기 제안값, 실제 문서 gap_hist를 보고 조정.
  dash_max_gap: 4.0
  # 점선으로 인정하는 최소 조각 수(정수, 2 이상). min_line_length 필터 직전에 적용된다.
  # 초기 제안값, 실제 문서 gap_hist를 보고 조정.
  dash_min_pieces: 3
  # 얇은 이미지 조각(점선 등)을 선 조각으로 본다. design 6.4절 해석 추가
  # (짧은 변이 thin_rect_max_width 이하인 이미지만. 사진, 로고 같은 두꺼운 이미지는 무시). false면 이미지는 선으로 쓰지 않는다.
  images_as_lines: true
